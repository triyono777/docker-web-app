services:
  web:
    build: .
    container_name: docker_notes_web
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://docker_user:docker_pass@db:5432/docker_notes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: docker_notes_db
    environment:
      POSTGRES_USER: docker_user
      POSTGRES_PASSWORD: docker_pass
      POSTGRES_DB: docker_notes
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker_user -d docker_notes"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
