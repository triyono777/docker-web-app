services:
  app:
    build: .
    container_name: laravel_notes_app
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Laravel Notes"
      APP_ENV: local
      APP_KEY: "base64:+ArX2cchB7BdHacI7nm63qK+4Ddlh1zNnldbc599LBs="
      APP_DEBUG: true
      APP_URL: http://localhost:8000
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: id_ID
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_notes
      DB_USERNAME: laravel_user
      DB_PASSWORD: laravel_pass
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: laravel_notes_mysql
    environment:
      MYSQL_DATABASE: laravel_notes
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ularavel_user", "-plaravel_pass"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: laravel_notes_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: laravel_user
      PMA_PASSWORD: laravel_pass
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
